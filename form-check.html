<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Form Check | Untrained Momentum</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main id="main">
    <section class="page-hero"><div class="narrow">
      <p class="eyebrow">Form delivery check</p>
      <h1>Test the website form.</h1>
      <p class="lede">This temporary page uses Formspree's basic HTML method with no custom submission JavaScript.</p>
    </div></section>
    <section class="section section-white"><div class="narrow">
      <form action="https://formspree.io/f/mljebgda" method="POST">
        <div class="form-grid">
          <div class="field full"><label for="email">Your email *</label><input id="email" type="email" name="email" required></div>
          <div class="field full"><label for="message">Message *</label><textarea id="message" name="message" required>Website form delivery test</textarea></div>
          <div class="field full"><button class="button" type="submit">Send test →</button></div>
        </div>
      </form>
    </div></section>
  </main>
</body>
</html>
