<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Orders | Untrained Momentum</title><link rel="stylesheet" href="/assets/client.css"></head><body class="client-app"><header class="client-topbar"><div class="client-shell"><a class="client-brand" href="/client/index.html"><span class="client-brand-mark"></span><span>Untrained Momentum</span></a><nav class="client-nav"><a href="/client/index.html">Dashboard</a><a id="edit-site" href="#">Edit site</a></nav></div></header><main class="client-main"><div class="client-shell"><section class="client-hero"><div><p class="client-eyebrow">Store Orders</p><h1 id="site-name">Orders</h1><p class="client-lede">Recent purchases completed through this website. Customer payment details stay in Stripe; this view stores only order references, totals, status, and customer email when available.</p></div></section><div id="orders-status"></div><section class="client-panel"><div style="overflow:auto"><table class="client-table"><thead><tr><th>Date</th><th>Customer</th><th>Total</th><th>Platform fee</th><th>Status</th></tr></thead><tbody id="orders-body"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></div></main><script type="module">import{api,escapeHtml,getSession}from'/assets/client.js';const slug=new URL(location.href).searchParams.get('site');if(!slug)location.href='/client/index.html';await getSession();document.querySelector('#edit-site').href=`/client/editor.html?site=${encodeURIComponent(slug)}`;const body=document.querySelector('#orders-body');try{const data=await api(`/api/client/orders?site=${encodeURIComponent(slug)}`);document.querySelector('#site-name').textContent=`${data.site.name} orders`;const money=(amount,currency)=>new Intl.NumberFormat('en-US',{style:'currency',currency:(currency||'usd').toUpperCase()}).format(Number(amount||0)/100);body.innerHTML=data.orders.length?data.orders.map(order=>`<tr><td>${escapeHtml(new Date(order.created_at).toLocaleString())}</td><td>${escapeHtml(order.customer_email||'—')}</td><td>${escapeHtml(money(order.amount_total,order.currency))}</td><td>${escapeHtml(money(order.platform_fee_amount,order.currency))}</td><td><span class="status-pill ${order.status==='paid'?'good':''}">${escapeHtml(order.status||'unknown')}</span></td></tr>`).join(''):'<tr><td colspan="5">No orders yet.</td></tr>';}catch(error){body.innerHTML=`<tr><td colspan="5">${escapeHtml(error.message)}</td></tr>`;}</script></body></html>
