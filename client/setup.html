<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Platform Setup | Untrained Momentum</title><link rel="stylesheet" href="/assets/client.css"></head><body class="client-app"><main class="login-wrap"><section class="login-card"><p class="client-eyebrow">One-time setup</p><h1>Create platform admin</h1><p class="client-muted">This works only before the first administrator exists and requires the private bootstrap token configured in Cloudflare.</p><form class="client-form" id="setup-form"><label class="client-field"><span>Name</span><input name="name" required></label><label class="client-field"><span>Email</span><input name="email" type="email" required></label><label class="client-field"><span>Password</span><input name="password" type="password" minlength="10" required></label><label class="client-field"><span>Bootstrap token</span><input name="token" type="password" required></label><button class="client-button" type="submit">Create administrator</button><div id="setup-status"></div></form></section></main><script type="module">import{escapeHtml}from'/assets/client.js';const form=document.querySelector('#setup-form'),status=document.querySelector('#setup-status');form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;const values=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'content-type':'application/json','x-bootstrap-token':values.token},body:JSON.stringify({name:values.name,email:values.email,password:values.password})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Setup failed');status.innerHTML='<div class="client-notice good">Administrator created. Redirecting to login…</div>';setTimeout(()=>location.href='/client/login.html',1000);}catch(error){status.innerHTML=`<div class="client-notice error">${escapeHtml(error.message)}</div>`;button.disabled=false;}});</script></body></html>
