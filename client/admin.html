<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Platform Admin | Untrained Momentum</title><link rel="stylesheet" href="/assets/client.css"></head><body class="client-app"><header class="client-topbar"><div class="client-shell"><a class="client-brand" href="/client/index.html"><span class="client-brand-mark"></span><span>Untrained Momentum</span></a><nav class="client-nav"><a href="/client/index.html">Dashboard</a></nav></div></header><main class="client-main"><div class="client-shell"><section class="client-hero"><div><p class="client-eyebrow">Platform Admin</p><h1>Hosted websites</h1><p class="client-lede">Manage domains, builder access, transaction fees, client content, Stripe onboarding, and store orders.</p></div></section><section class="client-panel"><div style="overflow:auto"><table class="client-table"><thead><tr><th>Site</th><th>Client</th><th>Domain</th><th>Stripe</th><th>Actions</th></tr></thead><tbody id="admin-sites"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></div></main><script type="module">import{api,escapeHtml,getSession}from'/assets/client.js';const session=await getSession();if(session.user.role!=='admin')location.href='/client/index.html';const body=document.querySelector('#admin-sites');try{const data=await api('/api/admin/clients');body.innerHTML=data.sites.length?data.sites.map(site=>`<tr><td><strong>${escapeHtml(site.name)}</strong><br><small>${escapeHtml(site.site_type||'site')}</small></td><td>${escapeHtml(site.owner_name)}<br><small>${escapeHtml(site.owner_email)}</small></td><td>${escapeHtml(site.custom_domain||'—')}</td><td><span class="status-pill ${site.stripe_charges_enabled?'good':site.stripe_account_id?'warn':''}">${site.stripe_charges_enabled?'Ready':site.stripe_account_id?'Incomplete':'Not connected'}</span></td><td><div class="client-card-actions"><a class="client-button small" href="/client/editor.html?site=${encodeURIComponent(site.slug)}">Edit</a><a class="client-button secondary small" href="/client/site-settings.html?site=${encodeURIComponent(site.slug)}">Settings</a>${site.builder_enabled?`<a class="client-button secondary small" href="/client/builder.html?site=${encodeURIComponent(site.slug)}">Builder</a>`:''}${site.stripe_account_id?`<a class="client-button secondary small" href="/client/orders.html?site=${encodeURIComponent(site.slug)}">Orders</a>`:''}</div></td></tr>`).join(''):'<tr><td colspan="5">No client sites yet.</td></tr>';}catch(error){body.innerHTML=`<tr><td colspan="5">${escapeHtml(error.message)}</td></tr>`;}</script></body></html>
