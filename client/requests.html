<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Work Requests | Untrained Momentum</title><link rel="stylesheet" href="/assets/client.css"><link rel="stylesheet" href="/assets/tracker.css"></head>
<body class="client-app" data-tracker-page="client"><header class="client-topbar"><div class="client-shell"><a class="client-brand" href="/client/index.html"><span class="client-brand-mark"></span><span>Untrained Momentum</span></a><nav class="client-nav"><a href="/client/index.html">Dashboard</a><button type="button" data-logout>Sign out</button></nav></div></header><main class="client-main"><div class="client-shell"><section class="client-hero"><div><p class="client-eyebrow">Client portal</p><h1>Work requests</h1><p class="client-lede">Send a request and follow its progress in one place.</p></div></section><div id="tracker-status" aria-live="polite"></div><div class="tracker-layout"><section class="client-panel tracker-main-panel"><div class="client-panel-header"><div><p class="client-eyebrow">Your requests</p><h2>Current & past work</h2></div></div><div class="tracker-list" id="client-work-list"><p>Loading requests…</p></div></section><aside><section class="client-panel"><div class="client-panel-header"><div><p class="client-eyebrow">Need something?</p><h2>New request</h2></div></div><form class="client-form" id="request-form"><label class="client-field"><span>Website</span><select name="site_id" id="request-site" required></select></label><label class="client-field"><span>Request title</span><input name="title" maxlength="180" required placeholder="What do you need changed?"></label><div class="client-form-row"><label class="client-field"><span>Type</span><select name="category"><option value="website">Website</option><option value="content">Content</option><option value="maintenance">Maintenance</option><option value="tech_support">Tech support</option><option value="other">Other</option></select></label><label class="client-field"><span>Priority</span><select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></label></div><label class="client-field"><span>Details</span><textarea name="description" required placeholder="Include the page, wording, links, or anything else that will help."></textarea></label><button class="client-button" type="submit">Send request</button></form></section></aside></div></div></main><script type="module" src="/assets/tracker.js"></script><script type="module" src="/assets/client-extended-load.js"></script></body></html>
