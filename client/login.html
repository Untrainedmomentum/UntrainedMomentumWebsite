<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Login | Untrained Momentum</title><link rel="stylesheet" href="/assets/client.css"></head>
<body class="client-app"><main class="login-wrap"><section class="login-card"><p class="client-eyebrow">Untrained Momentum</p><h1>Client login</h1><p class="client-muted">Manage your website content, images, store, and payment setup.</p><form class="client-form" id="login-form"><label class="client-field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label><label class="client-field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><button class="client-button" type="submit">Sign in</button><div id="login-status" aria-live="polite"></div></form><p class="client-muted"><a href="/">← Back to Untrained Momentum</a></p></section></main><script type="module">
import { api, escapeHtml } from '/assets/client.js';
const form=document.querySelector('#login-form');const status=document.querySelector('#login-status');
try{await api('/api/auth/session');location.href='/client/index.html';}catch{}
form.addEventListener('submit',async(e)=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='';try{const values=Object.fromEntries(new FormData(form));await api('/api/auth/login',{method:'POST',body:JSON.stringify(values)});location.href='/client/index.html';}catch(error){status.innerHTML=`<div class="client-notice error">${escapeHtml(error.message)}</div>`;button.disabled=false;}});
</script></body></html>
