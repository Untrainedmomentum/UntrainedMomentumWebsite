<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Website Preview | Untrained Momentum</title>
  <style>
    :root{--preview-primary:#b53a2a;--preview-accent:#f3f0e9;--ink:#171716;--paper:#fffdf8;--muted:#6f6b64}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,sans-serif;line-height:1.55}.preview-shell{width:min(1100px,calc(100% - 40px));margin:auto}.preview-bar{display:flex;justify-content:space-between;gap:20px;padding:13px 20px;background:#171716;color:#fff;font-size:.9rem}.preview-bar span{opacity:.7}.preview-hero{padding:clamp(70px,10vw,130px) 0;background:var(--preview-accent)}.preview-eyebrow{margin:0 0 12px;color:var(--preview-primary);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem}h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.035em;line-height:1}h1{max-width:900px;margin:0 0 24px;font-size:clamp(3rem,9vw,7rem)}h2{font-size:clamp(2.2rem,5vw,4rem);margin:0 0 30px}.preview-lede{max-width:750px;font-size:clamp(1.08rem,2.5vw,1.35rem);color:#333}.preview-button{display:inline-flex;margin-top:20px;padding:14px 22px;border-radius:999px;background:var(--preview-primary);color:#fff;text-decoration:none;font-weight:800}.preview-section{padding:75px 0}.preview-section.alt{background:#f5f3ee}.preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.preview-grid article{padding:24px;border:1px solid #ddd8cf;border-radius:14px;background:#fff}.preview-grid h3{margin-top:0}.preview-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.preview-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.preview-contact{font-size:1.05rem}.preview-error{max-width:720px;margin:80px auto;padding:30px}@media(max-width:700px){.preview-gallery{grid-template-columns:1fr}.preview-bar{font-size:.8rem}.preview-section{padding:55px 0}}
  </style>
</head>
<body>
  <div id="preview-root"><main class="preview-error"><h1>Loading preview…</h1></main></div>
  <script type="module" src="/assets/preview.js"></script>
</body>
</html>
