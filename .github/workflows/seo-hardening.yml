name: One-time SEO hardening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run SEO hardening script
        shell: bash
        run: |
          git show d47b23c55bf90df48cfd0692464941093032738d:.github/workflows/seo-hardening.yml > /tmp/seo-original.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/seo-original.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i, line in enumerate(lines[start:], start) if line.strip() == 'PY')
          block = lines[start:end]
          indents = [len(line) - len(line.lstrip()) for line in block if line.strip()]
          indent = min(indents)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in block) + '\n'
          Path('/tmp/seo-hardening.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/seo-hardening.py

      - name: Commit SEO hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml robots.txt _redirects
          if git diff --cached --quiet; then
            echo "No SEO changes needed"
          else
            git commit -m "Harden technical SEO, canonicals, metadata, and schema"
            git push
          fi
