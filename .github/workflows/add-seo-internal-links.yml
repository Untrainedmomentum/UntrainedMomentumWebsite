name: Strengthen SEO hub internal linking

on:
  push:
    paths:
      - '.github/workflows/add-seo-internal-links.yml'

permissions:
  contents: write

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source pages
        run: python3 scripts/patch-seo-links.py
      - name: Commit source updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-tech-help.html small-business-website-setup.html sitemap.xml
          git rm scripts/patch-seo-links.py .github/workflows/add-seo-internal-links.yml
          git commit -m "Strengthen internal links for local SEO pages"
          git push
