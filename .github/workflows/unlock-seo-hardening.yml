name: Unlock SEO hardening

on:
  push:
    branches: [main]
    paths:
      - 'seo-unlock.txt'

permissions:
  contents: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dispatcher guard and commit
        shell: bash
        run: |
          sed -i "/if: github.actor != 'github-actions\[bot\]'/d" .github/workflows/seo-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-hardening.yml
          git commit -m "Enable dispatched SEO hardening [skip ci]"
          git push
